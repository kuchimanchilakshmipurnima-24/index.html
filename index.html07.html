<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotify-like Demo</title>
  <style>
    :root{
      --bg:#121212; --card:#181818; --muted:#b3b3b3; --accent:#1db954;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, Arial, Helvetica, sans-serif;background:linear-gradient(180deg,#0f0f0f,#121212);color:#fff}

    /* layout */
    .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
    aside{background:var(--card);padding:18px;border-right:1px solid rgba(255,255,255,0.03)}
    header{display:flex;align-items:center;gap:18px;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,0.03)}
    main{padding:20px}

    /* sidebar */
    .logo{font-weight:800;font-size:20px;color:var(--accent);letter-spacing:1px}
    nav{margin-top:20px}
    nav a{display:block;padding:10px 8px;color:var(--muted);text-decoration:none;border-radius:6px;margin-bottom:6px}
    nav a:hover{background:var(--glass);color:#fff}

    .playlist{margin-top:24px}
    .playlist h4{margin:0 0 10px 0;color:var(--muted);font-size:13px}
    .playlist-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;color:var(--muted);cursor:pointer}
    .playlist-item img{width:44px;height:44px;border-radius:6px;object-fit:cover}
    .playlist-item:hover{background:var(--glass);color:#fff}

    /* content */
    .hero{display:flex;gap:18px;align-items:center}
    .hero img{width:160px;height:160px;border-radius:8px;object-fit:cover}
    .hero .info h2{margin:0;font-size:28px}
    .hero .info p{color:var(--muted);margin-top:6px}

    .tracks{margin-top:22px}
    .track{display:grid;grid-template-columns:40px 1fr 90px;gap:12px;align-items:center;padding:10px;border-radius:8px;color:var(--muted)}
    .track:hover{background:rgba(255,255,255,0.02);color:#fff}
    .track .title{display:flex;align-items:center;gap:12px}
    .track img{width:40px;height:40px;border-radius:6px;object-fit:cover}
    .play-btn{background:var(--accent);border:none;color:#000;padding:8px 12px;border-radius:999px;cursor:pointer}

    /* player bar */
    .player{position:fixed;left:220px;right
